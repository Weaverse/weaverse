name: 📚 SDK reference

# Regenerates the TypeDoc JSON that docs.weaverse.io renders as the SDK
# reference, and opens a PR on Weaverse/docs (`sdk-artifacts/`).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-reference

jobs:
  sdk-reference:
    # Stable releases of packages the reference covers: the fixed group
    # (`vX.Y.Z`), Next and Schema. CLI, Biome and prereleases are skipped.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.release.prerelease && (
        startsWith(github.event.release.tag_name, 'v') ||
        startsWith(github.event.release.tag_name, '@weaverse/next@') ||
        startsWith(github.event.release.tag_name, '@weaverse/schema@')))
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: ⎔ Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 📚 Generate TypeDoc JSON
        run: pnpm run sdk:reference

      - name: ⬇️ Checkout Weaverse/docs
        uses: actions/checkout@v4
        with:
          repository: Weaverse/docs
          token: ${{ secrets.DOCS_REPO_TOKEN }}
          path: docs

      - name: Copy artifacts
        run: cp sdk-reference/hydrogen.json sdk-reference/next.json docs/sdk-artifacts/

      - name: Open docs PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.DOCS_REPO_TOKEN }}
          path: docs
          branch: docs/sdk-reference-update
          commit-message: Update the SDK reference for ${{ github.event.release.tag_name || github.ref_name }}
          title: Update the SDK reference for ${{ github.event.release.tag_name || github.ref_name }}
          body: |
            Regenerated `sdk-artifacts/hydrogen.json` and `sdk-artifacts/next.json` from Weaverse/weaverse at `${{ github.event.release.tag_name || github.sha }}`.

            Review the generated pages in the Mintlify preview, then merge to publish.
          delete-branch: true
