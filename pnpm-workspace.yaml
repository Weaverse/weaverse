# Flat node_modules layout (matches what bun previously produced) so
# transitive deps keep resolving for code that imports them without
# declaring them as direct dependencies. Tightening to pnpm's strict
# `isolated` default is its own audit.
nodeLinker: hoisted

packages:
  - "packages/*"
  - "templates/*"

# Whitelist postinstall scripts. pnpm 11's default is to block them as
# a supply-chain hardening measure.
allowBuilds:
  esbuild: true
  lefthook: true
  "@biomejs/biome": true
  workerd: true
  "@parcel/watcher": true
  sharp: true

# pnpm 12 holds back packages published in the last 24 hours
# (`minimumReleaseAge`), and in CI it rejects a lockfile that pins one.
# The release ritual publishes core, react and hydrogen, then commits the
# lockfile that pins them right away, so our own scope is exempt.
# Third-party packages keep the cool-down.
minimumReleaseAgeExclude:
  - "@weaverse/*"

# Vite+ unified toolchain. `vite` is aliased to the
# `@voidzero-dev/vite-plus-core` distribution; `vitest` is pinned to the
# exact Vitest that `vite-plus` bundles (`vp toolchain vitest`), so the
# graph keeps one copy; `vite-plus` is the CLI (`vp`) used by package
# `test` scripts.
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vitest: 5.1.0
  vite-plus: 1.7.0

verifyDepsBeforeRun: false

overrides:
  vite: "catalog:"
  vitest: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
